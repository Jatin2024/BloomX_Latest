<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F38" />

    <title>BloomX Technologies | Websites, Web Apps & APIs Built to Last</title>
    <meta
      name="description"
      content="BloomX Technologies designs and builds responsive websites, custom React applications, APIs and cloud deployments — then maintains them so your business has a dependable foundation online."
    />
    <!-- Canonical, og:url and og:image are resolved against the real deployed
         origin at runtime by src/utils/useDocumentMeta.js — no domain is
         hard-coded here so the tags stay correct on every environment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BloomX Technologies" />
    <meta property="og:title" content="BloomX Technologies | Websites, Web Apps & APIs Built to Last" />
    <meta
      property="og:description"
      content="Design-led web development: responsive websites, custom React applications, APIs, cloud deployment and ongoing support."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BloomX Technologies" />
    <meta
      name="twitter:description"
      content="Design-led web development: responsive websites, custom React applications, APIs, cloud deployment and ongoing support."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!--
      Hero image preload (home route only).

      Without this the hero photograph cannot start downloading until the JS
      bundle has parsed and React has rendered — measured at ~800ms on a
      throttled connection. Injecting the link here starts the fetch during
      HTML parse instead, several hundred milliseconds earlier.

      This is a script rather than a static <link> because one index.html
      serves every route: a static preload would pull the home hero down on
      /services, /work and the rest, where it is never rendered.

      The values MUST mirror the `heroImage` descriptor in
      src/sections/Hero.jsx (same id, ratio, widths, quality and sizes) or
      the browser will download the photograph twice.
    -->
    <script>
      (function () {
        if (window.location.pathname !== '/') return;
        var id = 'photo-1550439062-609e1531270e';
        var url = function (w) {
          return (
            'https://images.unsplash.com/' + id +
            '?auto=format&fit=crop&w=' + w + '&q=60&h=' + Math.round((w * 5) / 4)
          );
        };
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.imageSrcset = [480, 720, 960, 1280]
          .map(function (w) { return url(w) + ' ' + w + 'w'; })
          .join(', ');
        link.imageSizes = '(min-width: 1024px) 46vw, 92vw';
        link.href = url(1280);
        document.head.appendChild(link);
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
