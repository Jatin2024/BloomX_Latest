# Render blueprint for the BloomX API.
#
# Render reads this from the repository root. The front end is NOT described
# here — it is deployed separately on Vercel from the client/ directory.
#
# To use it: Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked sync:false are deliberately not in source control; set them
# in the Render dashboard before the first deploy.

services:
  - type: web
    name: bloomx-api
    runtime: node
    # The API lives in a subdirectory of the monorepo.
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Render restarts the service if this stops returning 2xx.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render terminates TLS at its edge and forwards to the container, so
      # req.ip is the proxy without this. Rate limiting keys on req.ip —
      # leave this unset and every visitor shares one bucket.
      - key: TRUST_PROXY
        value: "1"

      # Browser origins allowed to call the API — comma separated, matching
      # the deployed front end exactly, including scheme and any www prefix.
      # For bloomxtechnologies.com that is:
      #   https://bloomxtechnologies.com,https://www.bloomxtechnologies.com
      #
      # Dashboard-managed rather than written here: it is environment
      # specific, and a literal `value:` is reapplied on every blueprint
      # sync, which would silently revert any change made in the dashboard.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # MongoDB Atlas connection string. Atlas must also allow Render's
      # outbound addresses under Network Access.
      - key: MONGO_URI
        sync: false

      # Signs admin requests AND the expiring resume download tokens.
      # Without it the admin endpoints return 503 by design.
      - key: ADMIN_API_KEY
        sync: false

    # Render injects PORT automatically; server.js reads process.env.PORT.
